<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Web Pages Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1> Interactive Web Page</h1>

  <!-- Part 1: Event Handling -->
  <section>
    <h2>Event Handling Demo</h2>
    <button id="clickBtn">Click Me</button>
    <p id="clickMsg"></p>
  </section>

  <!-- Part 2: Interactive Elements -->
  <section>
    <h2>Interactive Features</h2>

    <!-- Dark Mode Toggle -->
    <button id="themeToggle">Toggle Dark Mode</button>

    <!-- Counter -->
    <div>
      <button id="decrease">-</button>
      <span id="counterValue">0</span>
      <button id="increase">+</button>
    </div>

    <!-- Collapsible FAQ -->
    <div class="faq">
      <h3 class="faq-question">What is JavaScript? <span>+</span></h3>
      <p class="faq-answer">JavaScript makes web pages interactive and dynamic.</p>
    </div>
  </section>

  <!-- Part 3: Form Validation -->
  <section>
    <h2>Form Validation</h2>
    <form id="signupForm">
      <label>Name: <input type="text" id="name"></label><br>
      <label>Email: <input type="text" id="email"></label><br>
      <label>Password: <input type="password" id="password"></label><br>
      <button type="submit">Submit</button>
    </form>
    <p id="formMsg"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
